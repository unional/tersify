packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true

# GHSA-mw96-cpmx-2vgc: rollup < 4.59.0 allows arbitrary file write via path
# traversal. rollup reaches this repo only transitively, through storybook's vite
# builder, so no direct dependency range can move it — this override raises the
# floor for every consumer of it in the tree.
overrides:
  rollup: '>=4.59.0'

# Supply-chain soak: refuse packages published less than 24h ago, so a compromised
# release has a window to be caught and unpublished before it reaches a build.
#
# This must live here, not in .npmrc. pnpm only auto-enables STRICT soak mode when
# the setting comes from pnpm-workspace.yaml / config.yaml / CLI / env; a value in
# .npmrc runs in LOOSE mode, where a too-young package is silently appended to
# minimumReleaseAgeExclude and installed anyway. minimumReleaseAgeStrict is set
# explicitly so the enforcement does not depend on that inference.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# The soak above stays in force for everything. This is a pinned, exact-version
# exception for a dependency published inside the window by this same modernization
# sweep: the publisher is known and unpartial@1.0.7 carries dist.attestations
# (SLSA provenance). Remove the line once the version ages past the soak.
minimumReleaseAgeExclude:
  - unpartial@1.0.7
